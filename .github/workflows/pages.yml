# Publica el sitio en GitHub Pages cada vez que se sube algo a main.
# Arma la versión sin servidor (build.mjs → dist/) y la despliega.
#
# Hace falta una sola vez, en el repositorio: Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # También se puede correr a mano desde la pestaña Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación por vez; la que está en curso se deja terminar.
concurrency:
  group: pages
  cancel-in-progress: false

# Van en dos trabajos, como recomienda GitHub: la publicación arranca recién cuando el sitio
# armado terminó de subirse. En uno solo, a veces fallaba porque todavía no lo encontraba
# ("No artifacts named github-pages were found").
jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el código
        uses: actions/checkout@v7
      - name: Preparar Pages
        uses: actions/configure-pages@v6
      - name: Armar la versión sin servidor
        run: node build.mjs
      - name: Subir el sitio armado
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v5
